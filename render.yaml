# Render Blueprint for the live-session server (server.js: SvelteKit + /live WebSocket).
# The site itself stays on Vercel; it reaches this server through VITE_LIVE_ORIGIN.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are
# asked for once in the dashboard (copy them from Vercel) and never stored here.
services:
  - type: web
    name: zencode-live
    runtime: node
    plan: free # free sleeps after 15 min idle; use "starter" on event days
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /join
    # Live rooms are held in memory: never run more than one instance.
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The Vercel site allowed to call /api/live here (comma-separate several)
      - key: LIVE_ALLOWED_ORIGINS
        value: https://zencode.symphozen.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Firebase Admin, so sessions are saved in Firestore (otherwise memory only)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
